{% extends "base.html" %}
{% block title %}Register - {{ app_name }}{% endblock %}
{% block body %}
<h1 class="text-2xl font-bold">Create account</h1>
{% if setup_notice %}
<p role="alert" class="alert alert-error mt-4">{{ setup_notice }}</p>
{% endif %}
<form method="post" class="mt-4 flex flex-col gap-3">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="flex flex-col gap-1">
    <label class="label" for="register-name"><span>Name</span></label>
    <input class="input w-full" type="text" id="register-name" name="name" autocomplete="name">
  </div>
  <div class="flex flex-col gap-1">
    <label class="label" for="register-email"><span>Account email</span></label>
    <input class="input w-full" type="email" id="register-email" name="email" required autocomplete="username">
  </div>
  <div class="flex flex-col gap-1">
    <label class="label" for="register-password"><span>Password</span></label>
    <input class="input w-full" type="password" id="register-password" name="password" required minlength="12" autocomplete="new-password">
    <span class="text-xs opacity-70">Minimum 12 characters.</span>
  </div>
  <div class="flex flex-col gap-1">
    <label class="label" for="register-password-confirm"><span>Confirm password</span></label>
    <input class="input w-full" type="password" id="register-password-confirm" name="password_confirm" required minlength="12" autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-neutral w-full">Create account</button>
</form>
<p class="mt-4 text-sm opacity-70">Have an account? <a class="link" href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
