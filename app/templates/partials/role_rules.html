{# Renders a role's rules as resource/verb chips.
   Expects `r.rules` = list of {"resources": [...], "verbs": [...]}. #}
{% if r.rules %}
<div class="flex flex-wrap gap-2">
  {% for rule in r.rules %}
  <span class="flex items-center gap-1">
    <span class="badge badge-outline">{{ rule.resources|join(', ') }}</span>
    <span class="opacity-70" aria-hidden="true">→</span>
    <span class="badge badge-outline">{{ rule.verbs|join(', ') }}</span>
  </span>
  {% endfor %}
</div>
{% else %}
<span class="opacity-70">-</span>
{% endif %}
