{% if reveal_url and cell_id %}
<a href="{{ reveal_url }}"
   class="secret-masked"
   hx-get="{{ reveal_url }}"
   hx-target="#{{ cell_id }}"
   hx-swap="innerHTML"
   title="Reveal secret"
   aria-label="Reveal secret">*******</a>
{% else %}
<code class="secret-masked font-mono">*******</code>
{% endif %}
<span class="badge badge-soft badge-success" role="status">Updated</span>
