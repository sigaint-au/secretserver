{# Dialog panel after the token is minted (swapped into #cli-login-dlg-panel). #}
<h3 id="cli-login-dlg-title" class="text-lg font-bold">Login command</h3>
<p class="py-4 text-sm text-base-content/60">Paste this into a shell. The token expires in {{ minutes }} minutes.</p>
<label class="sr-only" for="cli-login-command">Login command</label>
<textarea id="cli-login-command" class="textarea w-full font-mono text-sm" rows="4" readonly>{{ command }}</textarea>
<div class="modal-action">
  <button type="button" class="copy-btn btn btn-neutral" data-copy-target="cli-login-command"
          data-clear-seconds="{{ clipboard_clear_seconds|default(30) }}">Copy command</button>
  <button type="button" class="btn btn-ghost" data-close-dialog="cli-login-dlg">Done</button>
</div>
