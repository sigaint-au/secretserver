{# Explicit light/dark toggle (daisyUI swap). State is synced by theme.js
   via input[data-theme-toggle]: checked = dark. Sun shows in dark mode
   (activating it returns to light) and vice versa. #}
<label class="swap swap-rotate" title="Toggle dark mode">
  <input type="checkbox" data-theme-toggle aria-label="Toggle dark mode">
  <svg class="swap-on h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
  </svg>
  <svg class="swap-off h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21.752 15.002A9.718 9.718 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 12 21.75a9.753 9.753 0 0 0 9.752-6.748Z"/>
  </svg>
</label>
