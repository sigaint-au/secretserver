<section class="list-panel">
  <h2>Classification banner</h2>
  <p class="muted">Shown at the top of every page when enabled.</p>
  <form method="post" id="banner-form" data-dirty-guard onsubmit="this._dirty=false">
    <input type="hidden" name="_csrf" value="{{ csrf_token }}">
    <input type="hidden" name="action" value="classification">
    <label class="check-row">
      <input type="checkbox" name="classification_enabled" value="1"
             {% if settings.classification_enabled in ('true', '1', 'yes', 'on') %}checked{% endif %}>
      Show classification banner
    </label>
    <label>Banner text
      <input type="text" name="classification_text" maxlength="120"
             value="{{ settings.classification_text }}"
             placeholder="OFFICIAL - SENSITIVE" required class="input">
    </label>
    <div class="row">
      <div>
        <label>Background colour</label>
        <div class="color-field">
          <input type="color" id="classification_color_picker"
                 value="{{ settings.classification_color }}"
                 oninput="document.getElementById('classification_color').value=this.value; updatePreview();" class="input">
          <input type="text" name="classification_color" id="classification_color"
                 value="{{ settings.classification_color }}" pattern="#[0-9A-Fa-f]{6}"
                 required oninput="syncColor('classification_color'); updatePreview();" class="input">
        </div>
      </div>
      <div>
        <label>Text colour</label>
        <div class="color-field">
          <input type="color" id="classification_fg_picker"
                 value="{{ settings.classification_fg }}"
                 oninput="document.getElementById('classification_fg').value=this.value; updatePreview();" class="input">
          <input type="text" name="classification_fg" id="classification_fg"
                 value="{{ settings.classification_fg }}" pattern="#[0-9A-Fa-f]{6}"
                 required oninput="syncColor('classification_fg'); updatePreview();" class="input">
        </div>
      </div>
    </div>
    <p class="muted preset-label">Presets</p>
    <div class="swatch-row">
      <button type="button" class="swatch" data-bg="#000000" title="Black" data-fg="#ffffff"></button>
      <button type="button" class="swatch" data-bg="#677381" title="Slate" data-fg="#ffffff"></button>
      <button type="button" class="swatch" data-bg="#47817F" title="Teal-grey" data-fg="#ffffff"></button>
      <button type="button" class="swatch" data-bg="#c62828" title="Red" data-fg="#ffffff"></button>
      <button type="button" class="swatch" data-bg="#ef6c00" title="Orange" data-fg="#000000"></button>
      <button type="button" class="swatch" data-bg="#f9a825" title="Amber" data-fg="#000000"></button>
      <button type="button" class="swatch" data-bg="#1565c0" title="Blue" data-fg="#ffffff"></button>
      <button type="button" class="swatch swatch-light" data-bg="#ffffff" title="White" data-fg="#000000"></button>
    </div>
    <div class="banner-preview" id="banner-preview"
         style="background: {{ settings.classification_color }}; color: {{ settings.classification_fg }};">
      {{ settings.classification_text or 'Preview' }}
    </div>
    <p class="form-actions"><button type="submit" class="btn btn-neutral">Save banner</button></p>
  </form>
</section>
{% include "partials/color_picker_js.html" %}
