{# Login-banner column for the auth split screen. Shown only when enabled. #}
<aside id="login-banner" class="flex flex-col justify-center bg-base-300 p-8" role="status">
  <div class="mx-auto flex w-full max-w-md flex-col gap-4">
    <p class="whitespace-pre-wrap">{{ login_banner.text }}</p>
    {% if login_banner.has_link %}
    <a class="link" href="{{ login_banner.link_url }}" rel="noopener noreferrer">{{ login_banner.link_text }}</a>
    {% endif %}
  </div>
</aside>
