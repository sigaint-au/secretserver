{# Sidebar nav icon. Expects `name` (set via {% with %}). Decorative only. #}
<svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {% if name == 'folder' %}
  <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M3 11h18"/>

  <path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L19 4"/><path d="M15.9 7.6l3.5 3.5"/><circle cx="16.5" cy="5.5" r="1.6"/>
  {% elif name == 'share' %}
  <circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>
  {% elif name == 'cpu' %}
  <rect x="7" y="7" width="10" height="10" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>
  {% elif name == 'trash' %}
  <path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m3 0-.8 12a2 2 0 0 1-2 1.9H8.8a2 2 0 0 1-2-1.9L6 7"/><path d="M10 11v6M14 11v6"/>

  <path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="3"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/>

  <path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6l7-3Z"/><path d="M9.5 12l2 2 3.5-4"/>
  {% elif name == 'inbox' %}
  <path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.5 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.5A2 2 0 0 0 16.6 4H7.4a2 2 0 0 0-1.8 1Z"/>

  <circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-5.5 7-5.5s7 2 7 5.5"/>
  {% elif name == 'tag' %}
  <path d="M4 4h6l10 10-6 6L4 10V4Z"/><circle cx="9" cy="9" r="1.5"/>
  {% elif name == 'clipboard' %}
  <rect x="6" y="4" width="12" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M10 14l2 2 4-4"/>
  {% elif name == 'audit' %}
  <circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>
  {% elif name == 'sliders' %}
  <path d="M4 8h9M19 8h1M4 16h3M13 16h7"/><circle cx="15.5" cy="8" r="2"/><circle cx="9.5" cy="16" r="2"/>
  {% endif %}
</svg>
