{% extends "auth_base.html" %}
{% block title %}Forgot password - {{ app_name }}{% endblock %}
{% block body %}
<div>
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Forgot password</h1>
    <p class="mt-2 text-sm text-base-content/60">
      Enter the email for your <strong>local</strong> account.
      LDAP directory passwords cannot be reset here.
    </p>
    <form method="post" class="mt-4 flex flex-col gap-3">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="grid gap-1">
        <label class="label" for="forgot-email">Account email</label>
        <input class="input w-full" type="email" id="forgot-email" name="email" required autocomplete="username">
      </div>
      <button type="submit" class="btn btn-primary w-full" data-busy="Sending…">Send reset link</button>
    </form>
    <p class="mt-4 text-sm text-base-content/60"><a class="link" href="{{ url_for('login') }}">← Back to sign in</a></p>
  </div>
</div>
{% endblock %}
