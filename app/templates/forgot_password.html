{% extends "base.html" %}
{% block title %}Forgot password - {{ app_name }}{% endblock %}
{% block body %}
<h1 class="text-2xl font-bold">Forgot password</h1>
<p class="mt-2 text-sm opacity-70">
  Enter the email for your <strong>local</strong> account.
  LDAP directory passwords cannot be reset here.
</p>
<form method="post" class="mt-4 flex flex-col gap-3">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="flex flex-col gap-1">
    <label class="label" for="forgot-email"><span>Account email</span></label>
    <input class="input w-full" type="email" id="forgot-email" name="email" required autocomplete="username">
  </div>
  <button type="submit" class="btn btn-neutral w-full">Send reset link</button>
</form>
<p class="mt-4 text-sm opacity-70"><a class="link" href="{{ url_for('login') }}">← Back to sign in</a></p>
{% endblock %}
