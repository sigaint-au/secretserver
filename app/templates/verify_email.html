{% extends "auth_base.html" %}
{% block title %}Verify email - {{ app_name }}{% endblock %}
{% block body %}
<div>
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Verify your email</h1>
    <p class="mt-2">We sent a verification link to <strong>{{ email }}</strong>.
      Open it to activate your account, then sign in.</p>
    <form method="post" action="{{ url_for('resend_verification') }}" class="mt-4">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <button type="submit" class="btn btn-ghost w-full">Resend verification email</button>
    </form>
    <p class="mt-4 text-sm text-base-content/60"><a class="link" href="{{ url_for('login') }}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
