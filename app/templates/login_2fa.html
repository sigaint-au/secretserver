{% extends "base.html" %}
{% block title %}Two-factor authentication - {{ app_name }}{% endblock %}
{% block body %}
<h1 class="text-2xl font-bold">Two-factor authentication</h1>
<p class="mt-2 text-sm opacity-70">
  Enter the 6-digit code from your authenticator app
  {% if email %}for <strong>{{ email }}</strong>{% endif %},
  or a recovery code.
</p>
<form method="post" class="mt-4 flex flex-col gap-3">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="flex flex-col gap-1">
    <label class="label" for="2fa-code"><span>Authentication code</span></label>
    <input class="input w-full" type="text" id="2fa-code" name="code" required autocomplete="one-time-code"
           inputmode="numeric" pattern="[0-9A-Za-z\- ]{6,20}"
           placeholder="123456 or xxxx-xxxx" autofocus>
  </div>
  <button type="submit" class="btn btn-neutral w-full">Verify code</button>
</form>
<form method="post" action="{{ url_for('logout') }}" class="mt-2 inline">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <button type="submit" class="btn btn-ghost w-full">Log out</button>
</form>
{% endblock %}
