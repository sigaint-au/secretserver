{% extends "auth_base.html" %}
{% block title %}Reset password - {{ app_name }}{% endblock %}
{% block body %}
<div x-data="{ show: false }">
  <div>
    <h1 class="text-2xl font-bold tracking-tight">Set a new password</h1>
    <p class="mt-2 text-sm text-base-content/60">Choose a new password for your local account (at least 12 characters).</p>
    <form method="post" class="mt-4 flex flex-col gap-3">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <div class="grid gap-1">
        <label class="label" for="reset-password">New password</label>
        <div class="join w-full">
          <input class="input join-item min-w-0 flex-1" :type="show ? 'text' : 'password'"
                 id="reset-password" name="password" required minlength="12" autocomplete="new-password">
          <button type="button" class="btn btn-ghost join-item" @click="show = !show"
                  :aria-pressed="show ? 'true' : 'false'" aria-controls="reset-password"
                  x-text="show ? 'Hide' : 'Show'"></button>
        </div>
      </div>
      <div class="grid gap-1">
        <label class="label" for="reset-password-confirm">Confirm password</label>
        <input class="input w-full" :type="show ? 'text' : 'password'"
               id="reset-password-confirm" name="password_confirm" required minlength="12" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary w-full" data-busy="Updating password…">Update password</button>
    </form>
    <p class="mt-4 text-sm text-base-content/60"><a class="link" href="{{ url_for('login') }}">← Back to sign in</a></p>
  </div>
</div>
{% endblock %}
