{% extends "base.html" %}
{% block title %}Reset password - {{ app_name }}{% endblock %}
{% block body %}
<h1 class="text-2xl font-bold">Set a new password</h1>
<p class="mt-2 text-sm opacity-70">Choose a new password for your local account (at least 12 characters).</p>
<form method="post" class="mt-4 flex flex-col gap-3" x-data="{ show: false }">
  <input type="hidden" name="_csrf" value="{{ csrf_token }}">
  <div class="flex flex-col gap-1">
    <label class="label" for="reset-password"><span>New password</span></label>
    <div class="join w-full">
      <input class="input join-item min-w-0 flex-1" :type="show ? 'text' : 'password'"
             id="reset-password" name="password" required minlength="12" autocomplete="new-password">
      <button type="button" class="btn btn-ghost join-item" @click="show = !show"
              :aria-pressed="show ? 'true' : 'false'" aria-controls="reset-password"
              x-text="show ? 'Hide' : 'Show'"></button>
    </div>
  </div>
  <div class="flex flex-col gap-1">
    <label class="label" for="reset-password-confirm"><span>Confirm password</span></label>
    <input class="input w-full" :type="show ? 'text' : 'password'"
           id="reset-password-confirm" name="password_confirm" required minlength="12" autocomplete="new-password">
  </div>
  <button type="submit" class="btn btn-neutral w-full" data-busy="Updating password…">Update password</button>
</form>
<p class="mt-4 text-sm opacity-70"><a class="link" href="{{ url_for('login') }}">← Back to sign in</a></p>
{% endblock %}
